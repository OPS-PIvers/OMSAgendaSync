name: Deploy to Google Apps Script

# Pushes the repository contents to the Apps Script project and updates the
# live web app deployment, so a merge to main is actually visible to users.
#
# Requires one repository secret:
#   CLASPRC_JSON - the contents of ~/.clasprc.json from a local `clasp login`
#                  by an account with edit access to the script.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@3

      - name: Authenticate
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Update the live web app deployment
        env:
          DEPLOYMENT_ID: AKfycbwtKGbS9PtKwSVgHUsN03r451weFHmEkK2QrtsLx0_XwmDoiFWa53rwXcn3TqoFRSKDWg
        run: |
          clasp create-deployment \
            --deploymentId "$DEPLOYMENT_ID" \
            --description "CI deploy ${GITHUB_SHA::7}"
