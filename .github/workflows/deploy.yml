name: Deploy to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'Code.js'
      - 'Constants.js'
      - 'index.html'
      - 'appsscript.json'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never let two deploys race each other onto the same deployment id.
concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The live web app deployment. Override with a repo variable if it ever changes.
      DEPLOYMENT_ID: ${{ vars.CLASP_DEPLOYMENT_ID || 'AKfycbwtKGbS9PtKwSVgHUsN03r451weFHmEkK2QrtsLx0_XwmDoiFWa53rwXcn3TqoFRSKDWg' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Authenticate clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Missing CLASPRC_JSON secret. Add the contents of your local ~/.clasprc.json as a repository secret."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user

      - name: Push source to Apps Script
        run: clasp push -f

      - name: Create version
        id: version
        run: |
          DESCRIPTION="$(git log -1 --pretty=%s | cut -c1-180) (${GITHUB_SHA::7})"
          clasp create-version "$DESCRIPTION"
          # create-version's JSON shape is not contractual, so read the number back.
          clasp --json list-versions > versions.json
          VERSION="$(node -e 'const v=require("./versions.json").map(x=>x.versionNumber);if(!v.length)process.exit(1);console.log(Math.max(...v))')"
          echo "Created version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

      - name: Update web app deployment
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DESCRIPTION: ${{ steps.version.outputs.description }}
        run: clasp redeploy "$DEPLOYMENT_ID" --versionNumber "$VERSION" --description "$DESCRIPTION"

      - name: Verify deployment
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          clasp --json list-deployments > deployments.json
          node -e '
            const want = {id: process.env.DEPLOYMENT_ID, v: Number(process.env.VERSION)};
            const hit = require("./deployments.json")
              .find(d => d.deploymentId === want.id && d.versionNumber === want.v);
            if (!hit) {
              console.error(`Deployment ${want.id} is not serving version ${want.v}.`);
              process.exit(1);
            }
            console.log(`Deployment ${want.id} is serving version ${want.v}.`);
          '
